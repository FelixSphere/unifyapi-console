# Keeps the pricing baseline honest.
#
# Two jobs, deliberately different in what they block:
#
#   offline  runs on every PR. Diffs the catalog against the committed
#            models.dev fixture, so editing a price without updating the
#            fixture (or vice versa) fails the PR that does it. No network, so
#            a models.dev outage can never redden an unrelated change.
#
#   live     runs daily and on demand. Fetches models.dev for real, marks which
#            drifted models are actually on sale (the public pricing page), and
#            when a vendor has repriced it rewrites the catalog SOURCE and opens
#            a pull request carrying the diff, the report and the new fixture.
#
#            It does NOT merge and it does NOT touch production: a repricing
#            changes what customers are invoiced the moment it deploys, so a
#            person decides whether the per-model discount absorbs the change
#            or passes it through, and merging is that decision. Once the new
#            price is live the console emails the customers who use the model
#            (controller/pricing_change_notify_task.go).
name: Pricing drift

on:
  pull_request:
    paths:
      - 'setting/ratio_setting/**'
      - 'scripts/pricing-drift/**'
      - '.github/workflows/pricing-drift.yml'
  push:
    branches: [main]
    paths:
      - 'setting/ratio_setting/**'
      - 'scripts/pricing-drift/**'
  schedule:
    # Daily 06:00 UTC. Vendors announce at any hour; a weekly check left
    # DeepSeek's 2026-08-16 rise unnoticed for days on models we sell.
    - cron: '0 6 * * *'
  workflow_dispatch:

env:
  # The public pricing page lists exactly the models enabled on a channel, so
  # the checker can tell "a price moved on a model customers call today" from
  # "a catalogued row nobody is routed to" without credentials or a database.
  PRICING_PAGE_URL: https://app.unifyapi.ai/api/pricing
  DRIFT_BRANCH: pricing-drift/auto

permissions:
  contents: read

jobs:
  offline:
    if: github.repository == 'FelixSphere/unifyapi-console'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # go vet and the build trip on //go:embed web/dist in a tree that has
      # never built the SPA. The stub is enough for the pricing packages.
      - name: Create embed stub
        run: mkdir -p web/dist && echo '<!doctype html>' > web/dist/index.html
      - name: Baseline tests
        run: go test ./setting/ratio_setting/ ./service/ ./scripts/pricing-drift/ -count=1
        env:
          GOWORK: off

  live:
    if: |
      github.repository == 'FelixSphere/unifyapi-console' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # A PR opened with the default GITHUB_TOKEN does not trigger the
          # repository's pull_request workflows, so CI would not run on it.
          # Set PRICING_DRIFT_PAT (a fine-grained token with contents +
          # pull-requests write) to get a fully checked PR; without it the PR
          # still opens and a reviewer re-runs CI by pushing to the branch.
          token: ${{ secrets.PRICING_DRIFT_PAT || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Create embed stub
        run: mkdir -p web/dist && echo '<!doctype html>' > web/dist/index.html

      - name: Check the catalog against models.dev
        id: drift
        env:
          GOWORK: off
        run: |
          set +e
          go run ./scripts/pricing-drift -served "$PRICING_PAGE_URL" -save /tmp/models-dev.json > drift.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat drift.txt
          # Also put it in the run summary. The log is where a report goes to
          # die: nobody opens a green run, and on a red one the summary is the
          # first thing shown.
          {
            echo "### Pricing drift"
            echo
            echo '```'
            cat drift.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Rewrite the catalog source to the vendors' current prices and refresh
      # the offline fixture to the feed they were read from. The old fixture is
      # removed because main_test.go derives the fixture name from
      # PricingSnapshotDate: one file per verified date, never two.
      - name: Rewrite the catalog to the current list prices
        id: fix
        if: steps.drift.outputs.exit_code == '1'
        env:
          GOWORK: off
        run: |
          set -euo pipefail
          today="$(date -u +%F)"
          echo "date=$today" >> "$GITHUB_OUTPUT"
          git rm -q --ignore-unmatch scripts/pricing-drift/testdata/models-dev-*.json
          set +e
          go run ./scripts/pricing-drift \
            -fixture /tmp/models-dev.json \
            -served "$PRICING_PAGE_URL" \
            -fix \
            -snapshot-date "$today" \
            -fixture-out "scripts/pricing-drift/testdata/models-dev-$today.json" \
            -pr-body /tmp/pr-body.md > /dev/null
          code=$?
          set -e
          # 1 is "drift found", which is the reason we are here; 2 is a real
          # failure of the rewriter and must stop the job.
          if [ "$code" = "2" ]; then exit 2; fi
          git add -A setting/ratio_setting/unifyapi_catalog.go scripts/pricing-drift/testdata
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Drift was reported but nothing was rewritable (retired model or withdrawn price). See the report."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --cached --stat
          fi

      # Run the baseline tests on the rewritten catalog so the PR body can say
      # up front whether it is green. Red is expected -- and wanted -- when a
      # model carrying real traffic moved: TestPinnedDollarsForTheModelsThat-
      # CarryTheTraffic holds hand-typed vendor figures that a person must
      # re-read from the vendor's own page.
      - name: Test the rewritten baseline
        id: verify
        if: steps.fix.outputs.changed == 'true'
        continue-on-error: true
        env:
          GOWORK: off
        run: go test ./setting/ratio_setting/ ./service/ ./scripts/pricing-drift/ -count=1 2>&1 | tee /tmp/verify.txt | grep -E '^(ok|FAIL|---)' || true

      - name: Open or update the pull request
        if: steps.fix.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PRICING_DRIFT_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          today="${{ steps.fix.outputs.date }}"
          {
            cat /tmp/pr-body.md
            echo
            echo "### Baseline tests on this diff"
            echo
            echo '```'
            grep -E '^(ok|FAIL|---|\s+--- FAIL)' /tmp/verify.txt || echo "(no test output captured)"
            echo '```'
            echo
            echo "_Opened by the daily pricing-drift workflow. Re-running it while this PR is open updates this branch in place._"
          } > /tmp/pr-full.md

          git config user.name "pricing-drift[bot]"
          git config user.email "pricing-drift@users.noreply.github.com"
          git checkout -B "$DRIFT_BRANCH"
          git commit -q -m "chore(pricing): move the catalogue to the vendors' list prices as of $today" \
            -m "Generated by scripts/pricing-drift -fix from models.dev. See the pull request for the per-model report and the review checklist."
          git push -f origin "$DRIFT_BRANCH"

          existing="$(gh pr list --head "$DRIFT_BRANCH" --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "chore(pricing): vendor list prices changed ($today)" --body-file /tmp/pr-full.md
            echo "Updated PR #$existing"
          else
            gh pr create --draft \
              --base main --head "$DRIFT_BRANCH" \
              --title "chore(pricing): vendor list prices changed ($today)" \
              --body-file /tmp/pr-full.md
          fi

      # Drift with nothing rewritable (a retired model, a withdrawn price) still
      # needs a person, and there is no PR to carry it, so the schedule shows red.
      - name: Fail when drift needs a decision no PR can carry
        if: steps.drift.outputs.exit_code == '1' && steps.fix.outputs.changed != 'true'
        run: exit 1

      - name: Fail on a checker error
        if: steps.drift.outputs.exit_code == '2'
        run: |
          echo "pricing-drift could not run (network or parse failure). Not a pricing problem."
          exit 1
