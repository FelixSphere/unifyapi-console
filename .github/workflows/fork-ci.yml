# Fork-owned CI. Deliberately a separate file from upstream's ci.yml so their
# edits to that file never conflict with ours.
#
# Gate design note: at upstream tag v1.0.0-rc.23, two of upstream's own
# quality scripts already fail on a clean checkout:
#   copyright:check  2 files (cosmetic blank line after the licence header)
#   format:check     3 files
# Those two run as advisory here --
# blocking on them would mean a permanently red pipeline that everyone learns to
# ignore, which is worse than no gate. Re-evaluate at each upstream bump; when a
# tag lands with them green, promote them to hard gates.
name: Fork CI

on:
  pull_request:
  push:
    branches: [main, 'brand/**', 'feat/**', 'merge/**']

jobs:
  web:
    # Never run in upstream, nor in a fork of this fork.
    if: github.repository == 'FelixSphere/unifyapi-console'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - run: bun install --frozen-lockfile

      # Hard gate. Protects the AGPLv3 s.7(b) attribution and the brand
      # overrides that degrade silently rather than erroring. Runs before the
      # slower steps so a licence regression fails fast.
      - name: Check brand and attribution invariants
        run: node scripts/check-brand-invariants.mjs

      - name: Check Bun test-runner imports
        run: node scripts/check-test-runner.mjs

      - run: bun run typecheck

      - run: bun run build

      - name: copyright:check (advisory - red upstream at rc.23)
        continue-on-error: true
        run: bun run copyright:check

      - name: format:check (advisory - red upstream at rc.23)
        continue-on-error: true
        run: bun run format:check

      - name: Test
        run: bun test

  backend:
    if: github.repository == 'FelixSphere/unifyapi-console'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum

      # main.go embeds web/dist, so this must come BEFORE go vet, not just
      # before go build: //go:embed is resolved during type-checking, so vet
      # fails with "pattern web/dist: no matching files found" without it.
      # web/dist is gitignored, so it never exists on a fresh checkout.
      # A stub keeps this job independent of the web job.
      - name: Stub embedded frontend
        run: mkdir -p web/dist && echo '<!doctype html>' > web/dist/index.html

      - run: go vet ./...
        env:
          GOWORK: off

      - run: go build -o /dev/null .
        env:
          GOWORK: off
          CGO_ENABLED: 0

      - run: go test ./...
        env:
          GOWORK: off

  perf-tools:
    # Gates scripts/perf/ -- the benchmark harness. Nothing here ships in the
    # console image, so this protects a measurement tool rather than the
    # product. It earns a job anyway: the harness reads raw HTTP off a socket,
    # and a bug in that reader is invisible by construction -- a truncated body
    # still yields a 200 with plausible timings, so a stalled upstream is
    # scored as a clean success. That exact bug shipped once (#19, fixed #20).
    #
    # Unconditional rather than behind a paths filter: the suite is stdlib-only
    # with no network and runs in ~1ms, so a filter would cost more in missed
    # renames than it saves in runner time.
    if: github.repository == 'FelixSphere/unifyapi-console'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned for the same reason go and bun are pinned above.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: bench.py wire-format tests
        run: python3 scripts/perf/test_bench.py

      # netpath.py and monitor.sh have no unit tests -- they are almost entirely
      # I/O. A syntax check is the honest floor: it catches the edit that breaks
      # them outright, and claims nothing more.
      - name: Syntax-check the untested tools
        run: |
          python3 -m py_compile scripts/perf/bench.py scripts/perf/netpath.py
          bash -n scripts/perf/monitor.sh
