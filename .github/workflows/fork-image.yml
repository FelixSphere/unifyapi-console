# UNIFYAPI-BRAND: ours. Publishes the fork's own console image.
#
# Upstream's docker-build.yml and docker-image-branch.yml push to
# calciumion/new-api and are gated to upstream, so they never run here. This is
# the fork's equivalent, pushing to GHCR under our own namespace.
#
# GHCR rather than Docker Hub: the GITHUB_TOKEN already authenticates to it with
# `packages: write`, so publishing needs no long-lived registry credentials.
#
# arm64 matters — the console instance in web/infra/console.tf is a t4g.small
# (Graviton), so an amd64-only image would not run on it. Both arches build on
# native runners rather than under QEMU, which also avoids patching upstream's
# Dockerfile to add --platform=$BUILDPLATFORM.
name: Publish console image

on:
  push:
    tags:
      - "unifyapi-v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to build"
        required: true
        type: string

env:
  # Literal rather than ghcr.io/${{ github.repository }}: GHCR rejects uppercase
  # in an image path, and the owner is spelled "FelixSphere". The job guard below
  # pins the repository anyway, so nothing is gained by deriving it.
  IMAGE: ghcr.io/felixsphere/unifyapi-console

jobs:
  build:
    name: Build & push (${{ matrix.arch }})
    if: github.repository == 'FelixSphere/unifyapi-console'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve image tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            raw="${{ inputs.ref }}"
          else
            raw="${GITHUB_REF#refs/tags/}"
          fi
          # A Docker tag cannot contain '+', which our VERSION uses to record the
          # upstream tag (unifyapi-v0.1.0+upstream-v1.0.0-rc.23). Replace the
          # separator rather than truncating, so the provenance stays readable.
          value="$(printf '%s' "$raw" | tr '/+' '--')"
          echo "value=$value" >> "$GITHUB_OUTPUT"

          # Only a tag push moves `latest`. The console instance pulls with
          # `--pull always` on every restart, so letting a manual build of an
          # arbitrary branch claim that tag would put unreleased code into
          # production at the next reboot, with nothing in Terraform changing to
          # show it. A dispatch still publishes its own ref-named tag, which is
          # what makes it useful for a trial build.
          if [ "${{ github.event_name }}" = "push" ]; then
            release=true
          else
            release=false
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

          {
            echo "tags<<TAGS"
            echo "${IMAGE}:${value}-${{ matrix.arch }}"
            if [ "$release" = true ]; then
              echo "${IMAGE}:latest-${{ matrix.arch }}"
            fi
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # VERSION is deliberately not overwritten with the git tag the way
      # upstream's workflow does: it encodes which upstream tag this fork sits
      # on, which an AGPL fork needs to keep reporting.
      - name: Build & push (${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.tag.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          # Stamps the SPA and index.html with the commit so a tab left open
          # across a release gets a reload prompt (common/build_id.go). Both
          # arch legs resolve the same SHA, so the two images agree.
          build-args: |
            BUILD_ID=${{ github.sha }}
          # Attestations would add unknown/unknown entries to each per-arch tag,
          # which the imagetools merge below would then carry into the combined
          # manifest. Off until the pipeline is proven, then reconsider.
          provenance: false

    # Both matrix legs resolve the same values, so it does not matter which leg
    # writes these — matrix job outputs otherwise overwrite each other.
    outputs:
      tag: ${{ steps.tag.outputs.value }}
      release: ${{ steps.tag.outputs.release }}

  manifest:
    name: Create multi-arch manifest
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge per-arch tags into one manifest
        env:
          TAG: ${{ needs.build.outputs.tag }}
          RELEASE: ${{ needs.build.outputs.release }}
        run: |
          set -euo pipefail
          merge_tags=("$TAG")
          if [ "$RELEASE" = true ]; then
            merge_tags+=(latest)
          fi
          for t in "${merge_tags[@]}"; do
            docker buildx imagetools create -t "${IMAGE}:${t}" \
              "${IMAGE}:${t}-amd64" "${IMAGE}:${t}-arm64"
          done
          docker buildx imagetools inspect "${IMAGE}:${TAG}"

      - name: Summary
        env:
          TAG: ${{ needs.build.outputs.tag }}
          RELEASE: ${{ needs.build.outputs.release }}
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${IMAGE}:${TAG}"
            if [ "$RELEASE" = true ]; then
              echo "${IMAGE}:latest"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
