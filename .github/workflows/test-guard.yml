# Enforces the operator rule: an existing test may not be changed without the
# operator's personal approval. See AGENTS.md, "Existing tests are not yours to
# change".
#
# Why this is a CI job and not CODEOWNERS: requiring code-owner review needs a
# paid plan on private repositories, and several UnifyAI repos are private. This
# works on every plan.
#
# It requires an approving review from a collaborator who is NOT the author.
# It used to name one operator account, and that made it unsatisfiable: agents
# here run with the operator's credentials, so the operator authors nearly every
# PR, and GitHub refuses to let anyone approve their own pull request
# ("Can not approve your own pull request"). The only way past it was
# `gh pr merge --admin`, so a rule meant to force a second look was instead
# teaching everyone to bypass the check -- worse than not having it.
#
# Not-the-author is also the protection that was actually wanted. The original
# comment claimed an agent could not produce the approval "with its own token";
# in this setup the agent HAS the operator's token, so naming an account never
# provided that guarantee. Requiring a different human does.
#
# ADDING tests is always allowed and this job stays green for it. Only files
# that are modified, deleted or renamed are gated.
name: Test guard

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  existing-tests-unchanged:
    if: github.repository == 'FelixSphere/unifyapi-console'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the base commit to diff against, not just the merge head.
          fetch-depth: 0

      - name: Find changed test files
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Diff from the MERGE BASE, not from the base branch tip. base.sha is
          # wherever main happens to be right now, so a two-dot diff also
          # reports test files that OTHER merged PRs changed after this branch
          # was cut -- attributing someone else's work to this author. That
          # false positive is worse than no guard, because a check that cries
          # wolf gets ignored.
          MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          echo "comparing $MERGE_BASE..$HEAD_SHA"

          # M = modified, D = deleted, R = renamed. A (added) is deliberately
          # absent: new tests need no approval.
          git diff --name-status --diff-filter=MDR "$MERGE_BASE" "$HEAD_SHA" \
            | cut -f2- | tr '\t' '\n' \
            | grep -E '(_test\.(go|py|rb)$|\.test\.(ts|tsx|js|jsx|mjs)$|\.spec\.(ts|tsx|js|jsx|mjs)$|(^|/)__tests__/|(^|/)tests?/|(^|/)testdata/)' \
            | sort -u > /tmp/changed_tests.txt || true

          if [ -s /tmp/changed_tests.txt ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "### Existing tests changed by this PR" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            sed 's/^/- `/; s/$/`/' /tmp/changed_tests.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No existing test was modified, deleted or renamed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Require an approving review from someone other than the author
        if: steps.changed.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Three conditions, and each one is load-bearing:
          #
          #   state == APPROVED        a COMMENTED review saying "approve" is
          #                            not an approval, and is the easy mistake.
          #   commit_id == HEAD_SHA    otherwise "approve, then push the test
          #                            edit" slips straight through.
          #   login != AUTHOR          the point of the rule. GitHub already
          #                            refuses self-approval, so this is belt
          #                            and braces rather than the load-bearing
          #                            part -- but it states the intent in the
          #                            check rather than relying on GitHub's.
          #
          # author_association is checked too: an approving review from someone
          # with no write access to this repository must not unblock a test
          # change. OWNER, MEMBER and COLLABORATOR are the ones that carry it.
          #
          # Spelled as three equality tests rather than a set membership test:
          # jq's `inside` compares strings by SUBSTRING, so a set test would
          # also accept any value that happens to be a substring of an accepted
          # one. No current GitHub value collides that way, which is exactly the
          # kind of accident that stops being true without anyone noticing.
          approved=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/reviews" --paginate \
            --jq "[.[] | select(
                    .state == \"APPROVED\"
                    and .commit_id == \"${HEAD_SHA}\"
                    and .user.login != \"${AUTHOR}\"
                    and (.author_association == \"OWNER\"
                         or .author_association == \"MEMBER\"
                         or .author_association == \"COLLABORATOR\")
                  )] | length")

          if [ "$approved" -gt 0 ]; then
            who=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/reviews" --paginate \
              --jq "[.[] | select(.state==\"APPROVED\" and .commit_id==\"${HEAD_SHA}\" and .user.login!=\"${AUTHOR}\") | .user.login] | unique | join(\", \")")
            echo "Approved by ${who} on ${HEAD_SHA}."
            {
              echo
              echo "Approved by \`${who}\` on this commit."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo
            echo "**Blocked.** Changing an existing test needs the operator's approval."
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo ""
            echo "This PR modifies, deletes or renames a test that already exists."
            echo ""
            echo "Adding tests needs no approval. Changing one does, because a failing"
            echo "test is evidence: the cheapest way to turn a red build green is to"
            echo "weaken the check, and that converts a defect the suite caught into"
            echo "one it never catches again."
            echo ""
            echo "To proceed, say in the PR:"
            echo "  1. Why the test must change -- what is actually wrong with it, as"
            echo "     distinct from what is inconvenient about it right now."
            echo "  2. What the change accomplishes -- what it will assert afterwards"
            echo "     that it does not assert today."
            echo "  3. What regression it could let through -- name the defect class the"
            echo "     current assertion catches, and whether the new one still catches it."
            echo ""
            echo "Then wait for an APPROVING REVIEW -- not a comment -- from a"
            echo "collaborator who is not the author of this PR, on this commit."
            echo ""
            echo "  gh pr review <n> --repo <owner/repo> --approve"
            echo ""
            echo "A comment whose body says \"Approve\" is not a review and does not"
            echo "count. GitHub will not let the author approve their own PR."
            echo "Pushing after approval clears it, by design."
            echo ""
            echo "Renames, reformatting and moving a test between files all count."
            echo "\"The behaviour changed on purpose\" is not an exemption -- it means the"
            echo "test encodes the old contract, which is exactly the case needing approval."
            echo ""
          } >&2

          echo "Files:" >&2
          sed 's/^/  /' /tmp/changed_tests.txt >&2
          exit 1
