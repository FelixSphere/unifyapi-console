# Enforces the operator rule: an existing test may not be changed without the
# operator's personal approval. See AGENTS.md, "Existing tests are not yours to
# change".
#
# Why this is a CI job and not CODEOWNERS: requiring code-owner review needs a
# paid plan on private repositories, and several UnifyAI repos are private. This
# works on every plan and enforces the same thing, because it checks for an
# APPROVED review from the operator's own account -- which an agent cannot
# produce with its own token.
#
# ADDING tests is always allowed and this job stays green for it. Only files
# that are modified, deleted or renamed are gated.
name: Test guard

# Runs on pull_request. A comment carrying an approval re-runs that run, rather
# than evaluating the gate a second time itself.
#
# #208 tried to do the evaluation directly on issue_comment and it did not work,
# in a way worth recording: an issue_comment run executes in the context of the
# DEFAULT BRANCH, so its check run attaches to main's SHA, not to the pull
# request's head. The job went green, on the wrong commit, and the PR stayed
# blocked. A check that passes somewhere nobody is looking is worse than one
# that fails, because it reads as done.
#
# Re-running the pull_request run puts the result back where it belongs by
# construction: that run already belongs to the PR's head SHA, and re-running it
# re-reads the comments, so the approval is picked up.
on:
  pull_request:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read
  actions: write # the rerun job below re-runs a workflow run

jobs:
  existing-tests-unchanged:
    if: >-
      github.repository == 'FelixSphere/unifyapi-console'
      && github.event_name == 'pull_request' 
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the base commit to diff against, not just the merge head.
          fetch-depth: 0

      - name: Find changed test files
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Diff from the MERGE BASE, not from the base branch tip. base.sha is
          # wherever main happens to be right now, so a two-dot diff also
          # reports test files that OTHER merged PRs changed after this branch
          # was cut -- attributing someone else's work to this author. That
          # false positive is worse than no guard, because a check that cries
          # wolf gets ignored.
          MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          echo "comparing $MERGE_BASE..$HEAD_SHA"

          # M = modified, D = deleted, R = renamed. A (added) is deliberately
          # absent: new tests need no approval.
          git diff --name-status --diff-filter=MDR "$MERGE_BASE" "$HEAD_SHA" \
            | cut -f2- | tr '\t' '\n' \
            | grep -E '(_test\.(go|py|rb)$|\.test\.(ts|tsx|js|jsx|mjs)$|\.spec\.(ts|tsx|js|jsx|mjs)$|(^|/)__tests__/|(^|/)tests?/|(^|/)testdata/)' \
            | sort -u > /tmp/changed_tests.txt || true

          if [ -s /tmp/changed_tests.txt ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "### Existing tests changed by this PR" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            sed 's/^/- `/; s/$/`/' /tmp/changed_tests.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No existing test was modified, deleted or renamed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Require the operator's approval
        if: steps.changed.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATOR: Yuchengw
          TOKEN: APPROVED-TEST-CHANGE
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          approve() {
            echo "Approved by ${OPERATOR}: $1"
            {
              echo
              echo "Approved by \`${OPERATOR}\` on this commit -- $1."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }

          # 1. An approving review naming THIS head commit. Otherwise "approve,
          # then push the test edit" would slip straight through.
          approved=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/reviews" --paginate \
            --jq "[.[] | select(.user.login==\"${OPERATOR}\" and .state==\"APPROVED\" and .commit_id==\"${HEAD_SHA}\")] | length")
          [ "$approved" -gt 0 ] && approve "approving review"

          # 2. A comment from the operator carrying the token and this head SHA.
          #
          # Needed because a review is not always available. Agents open PRs
          # through `gh` authenticated as the operator, so the operator is the
          # AUTHOR, and GitHub refuses a self-review: "Can not approve your own
          # pull request". Between this rule shipping on 2026-09-23 and
          # 2026-09-25 that made the gate unsatisfiable for every agent PR --
          # not strict, impossible. A control nobody can satisfy gets removed,
          # which is the outcome this rule least wants.
          approved_comment=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq "[.[] | select(.user.login==\"${OPERATOR}\") | select(.body | test(\"${TOKEN}[[:space:]]+${HEAD_SHA}\"))] | length")
          [ "$approved_comment" -gt 0 ] && approve "comment naming this SHA"

          # 3. A bare `LGTM` comment from the operator, posted AFTER the head
          # commit was authored. Added 2026-09-25 at the operator's request:
          # pasting a 40-character SHA correctly is the whole friction, and a
          # gate that is tedious to satisfy gets worked around rather than used.
          #
          # The timestamp does the job the SHA did. Push a new commit and every
          # earlier LGTM is older than it, so it stops counting -- "approve,
          # then push the test edit" still cannot slip through.
          #
          # It is weaker than the SHA in one specific way, and the difference is
          # worth stating rather than glossing: a committer date is settable
          # (GIT_COMMITTER_DATE), so a backdated commit could keep an old LGTM
          # alive. That is not the case this gate defends against. An agent that
          # would forge a date is an agent that would edit this file -- the
          # workflow runs from the PR's own copy, so it could simply delete the
          # job. This gate makes the rule visible and hard to pass through
          # inattention; it was never a defence against a determined bypass.
          #
          # The match is exact, ignoring case and whitespace only. "not LGTM
          # yet" and "LGTM once CI is green" both correctly fail to match.
          HEAD_TIME=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}" --jq '.commit.committer.date')
          echo "head commit ${HEAD_SHA} committed at ${HEAD_TIME}"

          approved_lgtm=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --paginate \
            --jq "[.[] | select(.user.login==\"${OPERATOR}\") | select(.created_at > \"${HEAD_TIME}\") | select((.body | ascii_upcase | gsub(\"[[:space:]]\";\"\")) == \"LGTM\")] | length")
          [ "$approved_lgtm" -gt 0 ] && approve "LGTM posted after this commit"

          {
            echo
            echo "**Blocked.** Changing an existing test needs the operator's approval."
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo ""
            echo "This PR modifies, deletes or renames a test that already exists."
            echo ""
            echo "Adding tests needs no approval. Changing one does, because a failing"
            echo "test is evidence: the cheapest way to turn a red build green is to"
            echo "weaken the check, and that converts a defect the suite caught into"
            echo "one it never catches again."
            echo ""
            echo "To proceed, say in the PR:"
            echo "  1. Why the test must change -- what is actually wrong with it, as"
            echo "     distinct from what is inconvenient about it right now."
            echo "  2. What the change accomplishes -- what it will assert afterwards"
            echo "     that it does not assert today."
            echo "  3. What regression it could let through -- name the defect class the"
            echo "     current assertion catches, and whether the new one still catches it."
            echo ""
            echo "Then get the operator's approval on THIS commit. Any one of:"
            echo ""
            echo "  - a comment on the PR whose entire body is:  LGTM"
            echo "  - an approving review, or"
            echo "  - a comment containing:  ${TOKEN} ${HEAD_SHA}"
            echo ""
            echo "LGTM is the short form and needs nothing copied. It must be the whole"
            echo "comment -- \"LGTM once CI passes\" does not count -- and it must be"
            echo "posted after the commit it approves."
            echo ""
            echo "Head commit was authored at: ${HEAD_TIME}"
            echo ""
            echo "Posting the approval is the whole action: a separate job watches"
            echo "for it and re-runs THIS run, which then re-reads the comments and"
            echo "turns green in place. Give it a few seconds."
            echo ""
            echo "The review and SHA routes stay because they still work; the comment"
            echo "route exists at all because the operator is usually the PR author, and"
            echo "GitHub refuses a self-review."
            echo ""
            echo "Pushing after approval clears it, by design: a new commit is newer"
            echo "than every LGTM before it, and the SHA stops matching."
            echo ""
            echo "Renames, reformatting and moving a test between files all count."
            echo "\"The behaviour changed on purpose\" is not an exemption -- it means the"
            echo "test encodes the old contract, which is exactly the case needing approval."
            echo ""
          } >&2

          echo "Files:" >&2
          sed 's/^/  /' /tmp/changed_tests.txt >&2
          exit 1

  # Posting an approval re-runs the PR's own guard run, so the result lands on
  # the PR's head SHA. Doing the evaluation here instead would attach it to the
  # default branch, which is the mistake #208 made.
  rerun-on-approval:
    if: >-
      github.repository == 'FelixSphere/unifyapi-console'
      && github.event_name == 'issue_comment'
      && github.event.issue.pull_request
      && (
        contains(github.event.comment.body, 'LGTM')
        || contains(github.event.comment.body, 'APPROVED-TEST-CHANGE')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-run the guard on the pull request's own head
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          head=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq '.head.sha')
          echo "PR #${PR} head is ${head}"

          # The newest pull_request run of THIS workflow for that head. Newest
          # rather than first: a branch update makes a new run, and re-running a
          # superseded one would report against a commit that is no longer the
          # head.
          run_id=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/test-guard.yml/runs?event=pull_request&head_sha=${head}" \
            --jq '.workflow_runs | sort_by(.created_at) | last | .id // empty')

          if [ -z "$run_id" ]; then
            echo "No pull_request run of this workflow for ${head}; nothing to re-run."
            exit 0
          fi

          conclusion=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion // "in_progress"')
          echo "run ${run_id} concluded: ${conclusion}"

          # Already green, or still going: re-running would either be a no-op or
          # would fight the run in flight.
          case "$conclusion" in
            success)     echo "Already passing; nothing to do."; exit 0 ;;
            in_progress) echo "Still running; it will read the comment itself."; exit 0 ;;
          esac

          # `gh run rerun` resolves the repository from the git remote, and this
          # job has no checkout: it fails with "failed to determine base repo:
          # fatal: not a git repository". The REST call takes the repository in
          # the path, like every other call in this step, so it needs nothing
          # from the filesystem.
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/rerun-failed-jobs"
          echo "Re-ran ${run_id}. It re-reads the PR comments, so the approval is picked up."
